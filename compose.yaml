services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flasharo
      POSTGRES_PASSWORD: flasharo_local
      POSTGRES_DB: flasharo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flasharo -d flasharo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
